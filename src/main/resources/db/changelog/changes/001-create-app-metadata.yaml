databaseChangeLog:
    - changeSet:
          id: 001-create-app-metadata
          author: allydevs
          changes:
              - createTable:
                    tableName: app_metadata
                    columns:
                        - column:
                              name: id
                              type: BIGINT
                              autoIncrement: true
                              constraints:
                                  primaryKey: true
                                  nullable: false

                        - column:
                              name: application_name
                              type: VARCHAR(100)
                              constraints:
                                  nullable: false

                        - column:
                              name: application_version
                              type: VARCHAR(50)
                              constraints:
                                  nullable: false

                        - column:
                              name: created_at
                              type: TIMESTAMP WITH TIME ZONE
                              constraints:
                                  nullable: false
